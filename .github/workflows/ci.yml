name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Syntax check all Python files
        run: python -m compileall -q src scripts tests
      - name: Import package
        run: python -c "import pd_drawing_analysis; print(pd_drawing_analysis.__version__)"
      - name: Run offline test suite
        run: pytest tests -q
        env:
          # Guard: tests must never reach the network.
          HF_HUB_OFFLINE: "1"
          TORCH_HOME: /tmp/empty-torch-home
