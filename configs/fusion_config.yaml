# Fusion Configuration for Small Datasets (~70-210 samples)
# Focus: Simple, robust fusion methods that won't overfit

# ============================================================================
# LATE FUSION (ENSEMBLE)
# ============================================================================
late_fusion:
  # Individual models for each modality
  tabular_model:
    type: "xgboost"
    params:
      max_depth: 3
      n_estimators: 100
      learning_rate: 0.1

  image_model:
    type: "xgboost"
    params:
      max_depth: 3
      n_estimators: 100
      learning_rate: 0.1

  # Fusion methods
  methods:
    - "simple_average"      # Average probabilities
    - "weighted_average"    # Weighted average (optimize weights)
    - "majority_voting"     # Majority vote on predictions

  # Weighted average settings
  weight_optimization:
    method: "grid_search"  # Grid search or bayesian
    weight_range: [0.0, 1.0]
    weight_step: 0.1
    cv_folds: 3  # Use 3-fold for weight optimization (keep data for final eval)

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"

# ============================================================================
# EARLY FUSION (CONCATENATION)
# ============================================================================
early_fusion:
  # Feature selection (CRITICAL for small datasets)
  feature_selection:
    enabled: true
    method: "selectkbest"  # or "mutual_info", "variance_threshold"
    k_features: 150  # Keep top 150 features (down from ~3900)
    score_func: "f_classif"  # ANOVA F-value

  # Alternative: mutual information
  mutual_info:
    enabled: false
    k_features: 150
    random_state: 42

  # Dimensionality reduction (optional)
  dimensionality_reduction:
    enabled: false
    method: "pca"  # or "none"
    n_components: 100
    variance_threshold: 0.95

  # Model
  model:
    type: "xgboost"
    params:
      max_depth: 4  # Slightly higher for combined features
      n_estimators: 100
      learning_rate: 0.1
      min_child_weight: 3
      reg_alpha: 0.1  # L1 regularization
      reg_lambda: 1.0  # L2 regularization

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"

# ============================================================================
# STACKING (META-LEARNING)
# ============================================================================
stacking:
  # Base models (level 0)
  base_models:
    - name: "tabular_xgboost"
      type: "xgboost"
      modality: "tabular"
      params:
        max_depth: 3
        n_estimators: 50

    - name: "image_xgboost"
      type: "xgboost"
      modality: "image"
      params:
        max_depth: 3
        n_estimators: 50

  # Meta-learner (level 1)
  meta_learner:
    type: "logistic_regression"  # Simple to prevent overfitting
    params:
      penalty: "l2"
      C: 1.0
      solver: "liblinear"

  # Cross-validation strategy
  use_out_of_fold: true  # Use OOF predictions to avoid overfitting
  cv_folds: 5
  cv_strategy: "stratified"

# ============================================================================
# MISSING MODALITY HANDLING
# ============================================================================
missing_modality:
  enabled: true

  # Strategies
  strategies:
    - "skip_modality"      # Train separate models for each available modality
    - "zero_imputation"    # Replace missing features with zeros
    - "mean_imputation"    # Replace missing features with mean

  # Training: Train models for each modality combination
  train_combinations:
    - ["tabular"]
    - ["image"]
    - ["tabular", "image"]

# ============================================================================
# EVALUATION SETTINGS
# ============================================================================
evaluation:
  # Metrics
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc_roc

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"  # Options: stratified, kfold
  shuffle: true
  random_seed: 42

  # Bootstrap confidence intervals
  bootstrap:
    enabled: true
    n_iterations: 1000
    confidence_level: 0.95

# ============================================================================
# EXPERIMENT SETTINGS
# ============================================================================
experiments:
  # Which fusion methods to run
  run_late_fusion: true
  run_early_fusion: true
  run_stacking: true

  # Output
  save_predictions: true
  save_models: true
  save_feature_importance: true

  # Comparison
  compare_with_single_modality: true
  generate_comparison_table: true
  generate_visualization: true

# ============================================================================
# FEATURE SELECTION DETAILS (for Early Fusion)
# ============================================================================
feature_selection:
  selectkbest:
    k_features: [50, 100, 150, 200]  # Test different values
    score_func: "f_classif"  # ANOVA F-value

  mutual_info:
    k_features: [50, 100, 150, 200]
    random_state: 42
    n_neighbors: 3  # For MI estimation

  variance_threshold:
    threshold: 0.0  # Remove zero-variance features

# ============================================================================
# HYPERPARAMETER TUNING
# ============================================================================
hyperparameter_tuning:
  enabled: false  # Set to true for systematic tuning

  # Late fusion: tune weights
  late_fusion_weights:
    method: "grid_search"
    weight_range: [0.0, 1.0]
    n_steps: 11  # 0.0, 0.1, ..., 1.0

  # Early fusion: tune feature count
  early_fusion_k:
    method: "grid_search"
    k_values: [50, 100, 150, 200, 250]

  # Stacking: tune meta-learner
  stacking_meta:
    method: "grid_search"
    C_values: [0.1, 1.0, 10.0]
    penalty_values: ["l1", "l2"]
