# Model Configuration for Small Datasets (~70-210 samples)
# Focus: Regularization + proper cross-validation

# ============================================================================
# RANDOM FOREST
# ============================================================================
random_forest:
  # Conservative settings to prevent overfitting
  n_estimators: 100
  max_depth: 8  # Limited depth for small datasets
  min_samples_split: 5
  min_samples_leaf: 3
  max_features: "sqrt"  # Reduce feature space per tree

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"  # Maintain class distribution

  # Hyperparameter tuning (small search space)
  param_grid:
    n_estimators: [50, 100, 200]
    max_depth: [5, 8, 10]
    min_samples_leaf: [2, 3, 5]

# ============================================================================
# XGBOOST
# ============================================================================
xgboost:
  # Very conservative settings
  n_estimators: 100
  max_depth: 3  # Very shallow for small datasets
  learning_rate: 0.1
  min_child_weight: 3  # Prevent overfitting
  subsample: 0.8  # Add randomness
  colsample_bytree: 0.8
  reg_alpha: 0.1  # L1 regularization
  reg_lambda: 1.0  # L2 regularization

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"

  # Hyperparameter tuning
  param_grid:
    n_estimators: [50, 100, 200]
    max_depth: [2, 3, 5]
    learning_rate: [0.05, 0.1, 0.2]
    min_child_weight: [1, 3, 5]

# ============================================================================
# LOGISTIC REGRESSION
# ============================================================================
logistic_regression:
  # Add regularization
  penalty: "l2"
  C: 1.0  # Inverse regularization strength
  solver: "liblinear"
  max_iter: 1000

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"

  # Hyperparameter tuning
  param_grid:
    C: [0.01, 0.1, 1.0, 10.0]
    penalty: ["l1", "l2"]

# ============================================================================
# SVM (RBF KERNEL)
# ============================================================================
svm:
  # RBF kernel for non-linear relationships
  kernel: "rbf"
  C: 1.0  # Regularization parameter
  gamma: "scale"  # Kernel coefficient
  probability: true  # Needed for AUC-ROC

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"

  # Hyperparameter tuning
  param_grid:
    C: [0.1, 1.0, 10.0]
    gamma: ["scale", "auto", 0.01, 0.1]

# ============================================================================
# SIMPLE MLP (NEURAL NETWORK)
# ============================================================================
mlp:
  # Small architecture with heavy regularization
  hidden_layers: [128, 64]  # Two hidden layers
  activation: "relu"
  dropout: 0.4  # Heavy dropout for small datasets
  batch_size: 16
  max_epochs: 100
  early_stopping_patience: 10
  learning_rate: 0.001
  weight_decay: 0.01  # L2 regularization

  # Cross-validation
  cv_folds: 5
  cv_strategy: "stratified"

  # Hyperparameter tuning
  param_grid:
    hidden_layers: [[64, 32], [128, 64], [256, 128]]
    dropout: [0.3, 0.4, 0.5]
    learning_rate: [0.0001, 0.001, 0.01]

# ============================================================================
# TRAINING SETTINGS
# ============================================================================
training:
  # Random seed for reproducibility
  random_seed: 42

  # Cross-validation settings
  cv_folds: 5
  cv_strategy: "stratified"  # Options: stratified, kfold
  shuffle: true

  # Metrics to compute
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc_roc

  # Feature importance
  compute_feature_importance: true
  top_n_features: 20

  # Output
  save_models: true
  save_predictions: true
  save_feature_importance: true

# ============================================================================
# FEATURE TYPES
# ============================================================================
features:
  tabular:
    n_features: ~100  # TSFresh + manual features
    feature_types: ["numerical"]
    preprocessing:
      - standard_scaling  # StandardScaler

  image:
    n_features: ~3800  # ResNet50 + HOG + spiral
    feature_types: ["numerical"]
    preprocessing:
      - standard_scaling  # StandardScaler
