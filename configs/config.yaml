# Configuration file for Parkinson's Disease Classification Project
# Optimized for small datasets (~70 samples)

# ============================================================================
# Data Configuration
# ============================================================================
data:
  # Paths
  tabular_data_path: "data/tabular/"
  image_data_path: "data/images/"

  # Data splits
  test_size: 0.2
  random_state: 42

  # Cross-validation
  n_splits: 5  # Stratified k-fold
  n_repeats: 3  # For repeated CV

# ============================================================================
# Feature Extraction
# ============================================================================
features:
  # Tabular features
  tabular:
    use_tsfresh: true
    use_manual_features: true
    n_tsfresh_features: 50  # Limit to prevent overfitting

  # Image features
  image:
    model: "resnet18"  # pretrained, frozen
    batch_size: 16
    alternative_features:  # If PyTorch not available
      use_hog: true
      use_lbp: true

# ============================================================================
# Data Augmentation
# ============================================================================
augmentation:
  enabled: false  # Disable by default for small datasets

  tabular:
    method: "smote"  # or "adasyn"
    sampling_strategy: 1.0  # Balance classes

  image:
    rotate: true
    rotate_range: [-15, 15]
    zoom_range: [0.9, 1.1]
    noise_level: 0.01
    max_augment_per_sample: 2

# ============================================================================
# Model Configuration
# ============================================================================
models:
  # Traditional ML (recommended for small datasets)
  xgboost:
    n_estimators: 50
    max_depth: 3
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

  random_forest:
    n_estimators: 100
    max_depth: 5
    min_samples_split: 5
    min_samples_leaf: 2
    max_features: "sqrt"

  svm:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"
    probability: true

  mlp:
    hidden_sizes: [64, 32]  # Small network!
    activation: "relu"
    alpha: 0.01  # Strong L2 regularization
    learning_rate_init: 0.001
    max_iter: 500
    early_stopping: true

# ============================================================================
# Fusion Methods
# ============================================================================
fusion:
  # Early fusion
  early:
    model_type: "xgboost"  # Base classifier
    normalize_features: true

  # Late fusion
  late:
    tabular_model_type: "xgboost"
    image_model_type: "xgboost"
    fusion_method: "weighted_average"  # or "average", "max"
    tabular_weight: 0.5

# ============================================================================
# Training Configuration
# ============================================================================
training:
  # Validation
  use_stratified_split: true

  # Hyperparameter tuning
  tune_hyperparameters: false  # Set to true for small grid search
  tuning_folds: 3

  # Early stopping (for MLP)
  patience: 10
  validation_fraction: 0.2

# ============================================================================
# Evaluation Configuration
# ============================================================================
evaluation:
  # Metrics to compute
  primary_metric: "f1"  # or "accuracy", "auc_roc"

  # Confidence intervals
  compute_confidence_intervals: true
  n_bootstrap: 1000
  confidence_level: 0.95

  # Cross-validation
  cross_validate: true

  # Visualizations
  save_plots: true
  plot_formats: ["png", "pdf"]

# ============================================================================
# Output Configuration
# ============================================================================
output:
  results_dir: "results/"
  figures_dir: "results/figures/"
  metrics_dir: "results/metrics/"
  models_dir: "results/models/"

  # Save artifacts
  save_predictions: true
  save_feature_importance: true
  save_confusion_matrix: true
  save_roc_curves: true

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "results/training.log"

# ============================================================================
# Reproducibility
# ============================================================================
reproducibility:
  random_seed: 42
  deterministic: true  # When possible

# ============================================================================
# Hardware Configuration
# ============================================================================
hardware:
  device: "auto"  # auto, cpu, cuda
  num_workers: 0  # For data loading
  pin_memory: false
